<title>골든타임 생산일지</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#EFF5F3; --surface:#FFFFFF; --surface-2:#E4EEEB;
  --border:#D4E0DC; --border-strong:#B9CAC4;
  --text-primary:#15211D; --text-secondary:#55685F; --text-muted:#8A9C93;
  --primary:#0E5A52; --primary-hover:#0A4740; --on-primary:#F4FBF9;
  --gold:#B67A0C; --gold-bg:#FBF0D9; --gold-text:#7A520A;
  --danger:#B5402B; --danger-bg:#FAEAE6;
  --success:#276B45; --success-bg:#E6F2EA;
  --shadow:0 20px 45px -25px rgba(15,40,35,0.35);
  --font-sans:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1614; --surface:#14201D; --surface-2:#1A2924;
    --border:#2A3A34; --border-strong:#3C4F47;
    --text-primary:#E9F3EF; --text-secondary:#9FB6AC; --text-muted:#6E8B7F;
    --primary:#4FC2AE; --primary-hover:#6BD4C0; --on-primary:#05231E;
    --gold:#E3A83B; --gold-bg:#2E2410; --gold-text:#F2C878;
    --danger:#E2695A; --danger-bg:#35201A;
    --success:#6FCB98; --success-bg:#163224;
    --shadow:0 20px 45px -25px rgba(0,0,0,0.6);
  }
}
:root[data-theme="dark"]{
  --bg:#0C1614; --surface:#14201D; --surface-2:#1A2924;
  --border:#2A3A34; --border-strong:#3C4F47;
  --text-primary:#E9F3EF; --text-secondary:#9FB6AC; --text-muted:#6E8B7F;
  --primary:#4FC2AE; --primary-hover:#6BD4C0; --on-primary:#05231E;
  --gold:#E3A83B; --gold-bg:#2E2410; --gold-text:#F2C878;
  --danger:#E2695A; --danger-bg:#35201A;
  --success:#6FCB98; --success-bg:#163224;
  --shadow:0 20px 45px -25px rgba(0,0,0,0.6);
}
*{box-sizing:border-box;}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
body{background:var(--bg);font-family:var(--font-sans);color:var(--text-primary);}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent;}
button:focus-visible, input:focus-visible{outline:2px solid var(--primary);outline-offset:2px;}
input{font:inherit;color:inherit;}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important;}}

.page{padding:2rem 1rem;display:flex;justify-content:center;}
.phone{
  width:100%;max-width:408px;background:var(--surface);
  border:0.5px solid var(--border);border-radius:28px;box-shadow:var(--shadow);
  overflow:hidden;display:flex;flex-direction:column;min-height:812px;
}
.appbar{
  display:flex;align-items:center;gap:10px;padding:16px;
  border-bottom:0.5px solid var(--border);background:var(--surface);flex:0 0 auto;
}
.appbar .backbtn{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:50%;flex:0 0 auto;color:var(--text-secondary);}
.appbar .backbtn:hover{background:var(--surface-2);}
.appbar .backbtn.hidden{visibility:hidden;}
.appbar h1{font-size:16px;font-weight:500;margin:0;flex:1;letter-spacing:-0.01em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.appbar .rightaction{font-size:13px;font-weight:500;color:var(--primary);padding:6px 10px;border-radius:999px;flex:0 0 auto;}
.appbar .rightaction:hover{background:var(--surface-2);}
.appbar .ciword{flex:0 0 auto;font-weight:700;font-size:12px;letter-spacing:0.02em;color:var(--text-secondary);}
.appbar .datepick{flex:0 0 auto;max-width:120px;font-family:var(--font-mono);font-size:12px;background:var(--surface-2);border:0.5px solid var(--border);border-radius:8px;padding:5px 6px;color:var(--text-primary);}

.content{flex:1;overflow-y:auto;padding:18px 16px 28px;display:flex;flex-direction:column;gap:16px;}
.content.tight{padding:10px;gap:0;}
.eyebrow{font-size:11px;font-weight:500;letter-spacing:0.06em;text-transform:uppercase;color:var(--text-muted);}

.card{background:var(--surface-2);border:0.5px solid var(--border);border-radius:14px;padding:16px;}

/* home */
.homegrid{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:8px;}
.linetile{width:100%;height:100%;min-height:0;background:var(--surface-2);border:0.5px solid var(--border);border-radius:20px;padding:12px;display:flex;flex-direction:column;gap:8px;}
.tilehead{display:flex;align-items:baseline;gap:4px;flex:0 0 auto;padding:0 2px;}
.tilenum{font-family:var(--font-mono);font-size:22px;font-weight:700;line-height:1;color:var(--text-primary);}
.tilelabel{font-size:11px;color:var(--text-muted);}
.slotlist{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px;}
.slotrow{flex:1;min-height:0;width:100%;background:var(--surface);border:0.5px solid var(--border);border-radius:10px;padding:0 10px;display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:12.5px;font-weight:500;color:var(--text-primary);}
.slotrow:hover{border-color:var(--primary);}
.slotrow.empty{color:var(--text-muted);border-style:dashed;font-weight:400;}
.slotname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.slotdot{width:6px;height:6px;border-radius:50%;flex:0 0 auto;}
.chev{flex:0 0 auto;color:var(--text-muted);}

/* weight grid */
.gridpick{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.weighttile{background:var(--surface-2);border:0.5px solid var(--border);border-radius:14px;padding:22px 8px;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:19px;font-weight:700;}
.weighttile:hover{border-color:var(--primary);color:var(--primary);}

/* product list */
.productrow{display:flex;align-items:center;justify-content:space-between;width:100%;background:var(--surface-2);border:0.5px solid var(--border);border-radius:14px;padding:15px 16px;font-size:14px;font-weight:500;}
.productrow:hover{border-color:var(--primary);}

/* hero */
.hero{background:var(--gold-bg);border-radius:16px;padding:18px 18px 16px;}
.hero .eyebrow{color:var(--gold-text);}
.heronum{font-family:var(--font-mono);font-size:26px;font-weight:700;color:var(--gold-text);margin:4px 0 10px;letter-spacing:-0.01em;}
.heromuted{font-size:13px;color:var(--gold-text);opacity:0.85;}
.herorow{display:flex;gap:18px;margin-top:12px;padding-top:12px;border-top:0.5px solid color-mix(in srgb, var(--gold-text) 25%, transparent);}
.herostat{flex:1;}
.herostat .k{font-size:11px;color:var(--gold-text);opacity:0.8;margin-bottom:2px;}
.herostat .v{font-family:var(--font-mono);font-size:13px;font-weight:700;color:var(--gold-text);}
.herofoot{font-size:11px;color:var(--gold-text);opacity:0.7;margin-top:10px;}

/* checkpoint grid */
.cpgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.cptile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;aspect-ratio:1/1;border-radius:14px;padding:8px;text-align:center;}
.cptile.filled{background:var(--surface-2);border:0.5px solid var(--border);position:relative;}
.cptile.filled img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:14px;}
.cptile.filled .cpoverlay{position:absolute;inset:0;background:linear-gradient(to top, rgba(0,0,0,0.55), transparent 55%);border-radius:14px;}
.cptile.filled .cplabel, .cptile.filled .cptime{position:relative;color:#fff;z-index:1;}
.cptile.filled .checkbadge{position:absolute;top:6px;right:6px;width:18px;height:18px;border-radius:50%;background:var(--success);color:#fff;display:flex;align-items:center;justify-content:center;z-index:1;}
.cptile.active{background:var(--surface);border:1.5px dashed var(--border-strong);color:var(--primary);}
.cptile.active:hover{border-color:var(--primary);}
.cptile.locked{background:var(--surface-2);border:0.5px solid var(--border);color:var(--text-muted);cursor:default;}
.cplabel{font-size:12px;font-weight:500;}
.cptime{font-family:var(--font-mono);font-size:11px;color:var(--text-secondary);}
.cptile.active .cptime, .cptile.locked .cptime{color:inherit;opacity:0.75;}

/* bottom action */
.actionbar{border-top:0.5px solid var(--border);padding:14px 16px;background:var(--surface);flex:0 0 auto;}
.btn{width:100%;padding:13px;border-radius:12px;font-size:14px;font-weight:500;text-align:center;display:block;}
.btn-primary{background:var(--primary);color:var(--on-primary);}
.btn-primary:hover{background:var(--primary-hover);}
.btn-primary:disabled{background:var(--surface-2);color:var(--text-muted);cursor:not-allowed;}
.btn-outline{background:transparent;border:1px solid var(--border-strong);color:var(--text-primary);text-align:center;}
.btn-outline:hover{border-color:var(--danger);color:var(--danger);}
.hint{font-size:12px;color:var(--text-muted);text-align:center;margin-top:8px;}
.banner{border-radius:12px;padding:12px 14px;font-size:13px;display:flex;align-items:center;gap:10px;}
.banner-gold{background:var(--gold-bg);color:var(--gold-text);}
.banner-success{background:var(--success-bg);color:var(--success);}

/* photo detail */
.photoframe{width:100%;aspect-ratio:4/3;border-radius:16px;background:var(--surface-2);border:0.5px solid var(--border);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;}
.photoframe img{width:100%;height:100%;object-fit:cover;}
.photoempty{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--text-muted);}
.timerow{display:flex;align-items:center;justify-content:space-between;background:var(--surface-2);border:0.5px solid var(--border);border-radius:12px;padding:12px 14px;}
.timerow .k{font-size:13px;color:var(--text-secondary);}
.timerow input[type="time"]{font-family:var(--font-mono);font-size:14px;font-weight:700;background:transparent;border:none;text-align:right;}
.errtext{font-size:12px;color:var(--danger);}
.btnrow{display:flex;gap:10px;}
.btnrow .btn{flex:1;}

/* approval */
.kv{display:flex;justify-content:space-between;padding:8px 0;font-size:13px;border-bottom:0.5px solid var(--border);}
.kv:last-child{border-bottom:none;}
.kv .k{color:var(--text-secondary);}
.kv .v{font-weight:500;font-family:var(--font-mono);}
.minigrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;}
.minithumb{aspect-ratio:1/1;border-radius:8px;background:var(--surface);border:0.5px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--success);position:relative;overflow:hidden;}
.minithumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
</style>

<h2 class="sr-only">당류 제조 라인의 소비기한 골든타임 생산 기록과 결재를 진행하는 모바일 앱 프로토타입입니다.</h2>

<div class="page">
  <div class="phone">
    <header class="appbar" id="appbar"></header>
    <main class="content" id="screen-root"></main>
  </div>
</div>

<script>
var STORAGE_KEY = 'goldenTimeLog_v6';
var CP_KEYS = ['start','plus2','plus4','plus6','plus8','end'];
var CP_LABELS = {start:'생산 시작', plus2:'+2시간', plus4:'+4시간', plus6:'+6시간', plus8:'+8시간', end:'생산 종료'};
var CP_OFFSETS = {start:0, plus2:2, plus4:4, plus6:6, plus8:8};
var LINE_WEIGHTS = {
  1: ['700g','1.2kg'],
  2: ['500g','700g','1.2kg','2.45kg'],
  3: ['5kg','9kg','10kg'],
  4: ['5kg','10kg','16kg','20kg']
};
var SHELF_LIFE_DAYS = {
  '500g':5,'700g':7,'1.2kg':10,'2.45kg':14,
  '5kg':18,'9kg':25,'10kg':28,'16kg':35,'20kg':40
};
var LINE_PRODUCTS = {
  1: {
    '700g': ['올리고당','요리올리고당','쌀올리고당','사과올리고당'],
    '1.2kg': ['올리고당','요리올리고당','쌀올리고당','사과올리고당']
  },
  2: {
    '500g': ['알룰로스 오리지널','알룰로스 시럽용'],
    '700g': ['물엿','조청쌀엿','요리당'],
    '1.2kg': ['물엿','조청쌀엿','요리당','노브랜드올리고당'],
    '2.45kg': ['물엿','물엿(수출)','조청쌀엿','요리당','요리올리고당','올리고당']
  },
  3: {
    '5kg': ['물엿'],
    '9kg': ['물엿'],
    '10kg': ['물엿']
  },
  4: {
    '5kg': ['황물엿','조청쌀엿','국산조청쌀엿','쉐프원올리고당','우리아이튼튼올리고당'],
    '10kg': ['황물엿'],
    '16kg': ['황물엿'],
    '20kg': ['조청쌀엿']
  }
};
var SLOT_COUNT = 4;

var ICON = {
  back:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
  chev:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>',
  camera:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8a2 2 0 0 1 2-2h1.5l1-1.5h7l1 1.5H18a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8z"/><circle cx="12" cy="13" r="3.5"/></svg>',
  camerasm:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8a2 2 0 0 1 2-2h1.5l1-1.5h7l1 1.5H18a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8z"/><circle cx="12" cy="13" r="3.5"/></svg>',
  lock:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>',
  check:'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>',
  badge:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2.4 2.2 3.1-.5 1 3 2.8 1.5-.9 3 .9 3-2.8 1.5-1 3-3.1-.5L12 22l-2.4-2.2-3.1.5-1-3-2.8-1.5.9-3-.9-3 2.8-1.5 1-3 3.1.5z"/><path d="M9 12l2 2 4-4"/></svg>'
};

var CI_LOGO_HTML = '<span class="ciword" aria-hidden="true">DAESANG</span>';

function pad(n){ return String(n).padStart(2,'0'); }
function fmtTime(d){ d=new Date(d); return pad(d.getHours())+':'+pad(d.getMinutes()); }
function fmtDate(d){ d=new Date(d); return d.getFullYear()+'.'+pad(d.getMonth()+1)+'.'+pad(d.getDate()); }
function fmtDateTime(d){ return fmtDate(d)+' '+fmtTime(d); }
function addHours(d,h){ return new Date(new Date(d).getTime()+h*3600*1000); }
function addDays(d,n){ return new Date(new Date(d).getTime()+n*86400000); }
function dateKey(d){ d=new Date(d); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function todayStr(){ return dateKey(new Date()); }
function todayAt(h,m){ var d=new Date(); d.setHours(h,m,0,0); return d.toISOString(); }

function emptyJob(weight, product){
  var cps={};
  CP_KEYS.forEach(function(k){ cps[k]={photo:null, time:null}; });
  return { weight:weight, product:product, startAt:null, endAt:null, checkpoints:cps, status:'in_progress', requestedAt:null, approvedBy:null, approvedAt:null };
}
function emptyLine(){ return { slots:[null,null,null,null] }; }
function emptyDay(){
  var lines = {};
  [1,2,3,4].forEach(function(id){ lines[id] = emptyLine(); });
  return { lines:lines };
}

function seedState(){
  var byDate = {};
  var today = todayStr();
  byDate[today] = emptyDay();

  var j1 = emptyJob('700g','올리고당');
  j1.startAt = todayAt(6,0);
  j1.checkpoints.start = {photo:'seed', time:j1.startAt};
  j1.checkpoints.plus2 = {photo:'seed', time:addHours(j1.startAt,2).toISOString()};
  j1.checkpoints.plus4 = {photo:'seed', time:addHours(j1.startAt,4).toISOString()};
  byDate[today].lines[1].slots[0] = j1;

  var j1b = emptyJob('1.2kg','쌀올리고당');
  j1b.startAt = todayAt(7,20);
  j1b.checkpoints.start = {photo:'seed', time:j1b.startAt};
  byDate[today].lines[1].slots[1] = j1b;

  var j3 = emptyJob('9kg','물엿');
  j3.startAt = todayAt(5,30);
  j3.endAt = todayAt(13,40);
  CP_KEYS.forEach(function(k){
    var t = k==='start'?j3.startAt : k==='end'?j3.endAt : addHours(j3.startAt, CP_OFFSETS[k]).toISOString();
    j3.checkpoints[k]={photo:'seed', time:t};
  });
  j3.status='pending_approval';
  j3.requestedAt = addHours(j3.endAt,0.1).toISOString();
  byDate[today].lines[3].slots[0] = j3;

  var yStr = dateKey(addDays(new Date(),-1));
  byDate[yStr] = emptyDay();
  var j4 = emptyJob('10kg','황물엿');
  j4.startAt = yStr+'T06:10:00';
  j4.endAt = yStr+'T14:05:00';
  CP_KEYS.forEach(function(k){
    var t = k==='start'?j4.startAt : k==='end'?j4.endAt : addHours(j4.startAt, CP_OFFSETS[k]).toISOString();
    j4.checkpoints[k]={photo:'seed', time:t};
  });
  j4.status='approved';
  j4.approvedBy='이수정 · 품질관리팀';
  j4.approvedAt = yStr+'T14:40:00';
  byDate[yStr].lines[4].slots[0] = j4;

  return { byDate:byDate };
}

var state = null;
var currentDateStr = todayStr();
function loadState(){
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return seedState();
}
function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
}
function ensureDay(dateStr){
  if(!state.byDate[dateStr]) state.byDate[dateStr] = emptyDay();
  return state.byDate[dateStr];
}
function getJob(lineId, slot){ return ensureDay(currentDateStr).lines[lineId].slots[slot]; }
function setJob(lineId, slot, job){ ensureDay(currentDateStr).lines[lineId].slots[slot] = job; }
function onDateChange(v){
  if(!v) return;
  if(v > todayStr()) v = todayStr();
  currentDateStr = v;
  nav = [{screen:'home'}];
  render();
}

var nav = [{screen:'home'}];
var tempPick = { lineId:null, slot:null, weight:null };

function push(entry){ nav.push(entry); render(); }
function goHome(){ nav = [{screen:'home'}]; render(); }
function goBack(){ if(nav.length>1) nav.pop(); render(); }

function openSlot(lineId, slot){
  var job = getJob(lineId, slot);
  if(!job){ push({screen:'weight', lineId:lineId, slot:slot}); }
  else { push({screen:'tracking', lineId:lineId, slot:slot}); }
}
function changeItem(lineId, slot){ push({screen:'weight', lineId:lineId, slot:slot}); }
function chooseWeight(lineId, slot, w){ tempPick={lineId:lineId, slot:slot, weight:w}; push({screen:'product', lineId:lineId, slot:slot}); }
function chooseProduct(lineId, slot, p){
  setJob(lineId, slot, emptyJob(tempPick.weight, p));
  saveState();
  nav = nav.filter(function(n){ return n.screen!=='weight' && n.screen!=='product'; });
  push({screen:'tracking', lineId:lineId, slot:slot});
}
function openCheckpoint(lineId, slot, key){
  var job = getJob(lineId, slot);
  if(key!=='start' && !job.startAt) return;
  push({screen:'photo', lineId:lineId, slot:slot, key:key});
}
function openApproval(lineId, slot){ push({screen:'approval', lineId:lineId, slot:slot}); }

function requestApproval(lineId, slot){
  var job = getJob(lineId, slot);
  if(!approvalReady(job)) return;
  job.status='pending_approval';
  job.requestedAt = new Date().toISOString();
  saveState();
  render();
}
function approveJob(lineId, slot){
  var job = getJob(lineId, slot);
  job.status='approved';
  job.approvedBy='이수정 · 품질관리팀';
  job.approvedAt = new Date().toISOString();
  saveState();
  render();
}

function approvalReady(job){
  if(!job || !job.startAt || !job.endAt) return false;
  return CP_KEYS.every(function(k){ return !!job.checkpoints[k].photo; });
}
function filledCount(job){
  if(!job) return 0;
  return CP_KEYS.filter(function(k){ return job.checkpoints[k].photo; }).length;
}
function consumeBy(job){
  if(!job || !job.endAt) return null;
  var days = SHELF_LIFE_DAYS[job.weight];
  return addDays(job.endAt, days);
}
function slotDotColor(job){
  if(job.status==='approved') return 'var(--success)';
  if(job.status==='pending_approval') return 'var(--gold)';
  return 'var(--primary)';
}

var pendingFileData = null;
function triggerFilePick(){ document.getElementById('cp-file-input').click(); }
function handleFile(input){
  var file = input.files && input.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(e){
    var img = new Image();
    img.onload = function(){
      var maxW = 480;
      var scale = Math.min(1, maxW/img.width);
      var canvas = document.createElement('canvas');
      canvas.width = img.width*scale; canvas.height = img.height*scale;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(img,0,0,canvas.width,canvas.height);
      pendingFileData = canvas.toDataURL('image/jpeg',0.72);
      renderPhotoScreen(currentLineId(), currentSlot(), currentKey());
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}
function currentLineId(){ return nav[nav.length-1].lineId; }
function currentSlot(){ return nav[nav.length-1].slot; }
function currentKey(){ return nav[nav.length-1].key; }

function savePhoto(){
  var lineId = currentLineId(), slot = currentSlot(), key = currentKey();
  var job = getJob(lineId, slot);
  var cp = job.checkpoints[key];
  var photo = pendingFileData || cp.photo;
  if(!photo){
    document.getElementById('photo-err').textContent = '사진을 먼저 선택해 주세요.';
    return;
  }
  cp.photo = photo;
  var timeInput = (key==='start' || key==='end') ? document.getElementById('cp-time-input') : null;
  if(timeInput){
    var val = timeInput.value;
    if(!val){ document.getElementById('photo-err').textContent = '시각을 입력해 주세요.'; return; }
    var base = cp.time ? new Date(cp.time) : new Date();
    var parts = val.split(':');
    base.setHours(parseInt(parts[0],10), parseInt(parts[1],10), 0, 0);
    var iso = base.toISOString();
    cp.time = iso;
    if(key==='start') job.startAt = iso; else job.endAt = iso;
  } else if(key!=='start' && key!=='end' && !cp.time){
    cp.time = addHours(job.startAt, CP_OFFSETS[key]).toISOString();
  }
  pendingFileData = null;
  saveState();
  goBack();
}
function deletePhoto(){
  var lineId = currentLineId(), slot = currentSlot(), key = currentKey();
  getJob(lineId, slot).checkpoints[key].photo = null;
  pendingFileData = null;
  saveState();
  renderPhotoScreen(lineId, slot, key);
}

function renderAppBar(title, opts){
  opts = opts || {};
  var bar = document.getElementById('appbar');
  bar.innerHTML =
    '<button class="backbtn'+(opts.showBack?'':' hidden')+'" onclick="goBack()" aria-label="뒤로가기">'+ICON.back+'</button>'+
    '<h1>'+title+'</h1>'+
    (opts.rightLabel ? '<button class="rightaction" onclick="'+opts.rightAction+'">'+opts.rightLabel+'</button>' : '')+
    (opts.showDate ? '<input type="date" class="datepick" value="'+currentDateStr+'" max="'+todayStr()+'" onchange="onDateChange(this.value)" aria-label="날짜 선택">' : '')+
    CI_LOGO_HTML;
}

function cpTileHTML(lineId, slot, job, key){
  var cp = job.checkpoints[key];
  var label = CP_LABELS[key];
  var locked = (key!=='start' && !job.startAt);
  var timeText;
  if(key==='start') timeText = job.startAt ? fmtTime(job.startAt) : '시각 선택';
  else if(key==='end') timeText = job.endAt ? fmtTime(job.endAt) : (job.startAt ? '시각 선택' : '시작 후 활성화');
  else timeText = job.startAt ? fmtTime(addHours(job.startAt, CP_OFFSETS[key])) : '시작 후 활성화';

  if(cp.photo){
    var img = cp.photo.indexOf('data:')===0 ? '<img src="'+cp.photo+'" alt="">' : '';
    var placeholderBg = img ? '' : 'background:linear-gradient(135deg, color-mix(in srgb, var(--primary) 22%, var(--surface-2)), var(--surface-2));';
    return '<button class="cptile filled" style="'+placeholderBg+'" onclick="openCheckpoint('+lineId+','+slot+',\''+key+'\')">'+
      img+'<div class="cpoverlay"></div>'+
      '<span class="checkbadge">'+ICON.check+'</span>'+
      '<span class="cplabel">'+label+'</span><span class="cptime">'+timeText+'</span></button>';
  }
  if(locked){
    return '<div class="cptile locked">'+ICON.lock+'<span class="cplabel">'+label+'</span><span class="cptime">'+timeText+'</span></div>';
  }
  return '<button class="cptile active" onclick="openCheckpoint('+lineId+','+slot+',\''+key+'\')">'+ICON.camerasm+'<span class="cplabel">'+label+'</span><span class="cptime">'+timeText+'</span></button>';
}

function renderHome(){
  renderAppBar('소비기한 골든타임 일지', {showBack:false, showDate:true});
  var html = '<div class="homegrid">';
  [1,2,3,4].forEach(function(id){
    var slots = ensureDay(currentDateStr).lines[id].slots;
    html += '<div class="linetile">'+
      '<div class="tilehead"><span class="tilenum">'+id+'</span><span class="tilelabel">호기</span></div>'+
      '<div class="slotlist">'+
        slots.map(function(job, i){
          var label = job ? job.product : '품목선택 '+(i+1);
          var dot = job ? '<span class="slotdot" style="background:'+slotDotColor(job)+'"></span>' : '';
          return '<button class="slotrow'+(job?'':' empty')+'" onclick="openSlot('+id+','+i+')"><span class="slotname">'+label+'</span>'+dot+'</button>';
        }).join('')+
      '</div>'+
    '</div>';
  });
  html += '</div>';
  document.getElementById('screen-root').innerHTML = html;
}

function renderWeight(lineId, slot){
  renderAppBar(lineId+'호기 · 중량 선택', {showBack:true});
  var html = '<div class="eyebrow">품목선택 '+(slot+1)+' · 1/2</div><div class="gridpick">';
  LINE_WEIGHTS[lineId].forEach(function(w){
    html += '<button class="weighttile" onclick="chooseWeight('+lineId+','+slot+',\''+w+'\')">'+w+'</button>';
  });
  html += '</div>';
  document.getElementById('screen-root').innerHTML = html;
}

function renderProduct(lineId, slot){
  renderAppBar(tempPick.weight+' · 제품 선택', {showBack:true});
  var html = '<div class="eyebrow">품목선택 '+(slot+1)+' · 2/2</div>';
  LINE_PRODUCTS[lineId][tempPick.weight].forEach(function(p){
    html += '<button class="productrow" onclick="chooseProduct('+lineId+','+slot+',\''+p+'\')"><span>'+p+'</span><span class="chev">'+ICON.chev+'</span></button>';
  });
  document.getElementById('screen-root').innerHTML = html;
}

function renderTracking(lineId, slot){
  var job = getJob(lineId, slot);
  var locked = job.status==='approved';
  renderAppBar(lineId+'호기 · '+job.product, locked ? {showBack:true} : {showBack:true, rightLabel:'품목 변경', rightAction:'changeItem('+lineId+','+slot+')'});
  var cb = consumeBy(job);
  var heroBody = cb ?
    '<div class="heronum">'+fmtDateTime(cb)+'</div><div class="heromuted">까지 소비 권장 (기준 '+SHELF_LIFE_DAYS[job.weight]+'일)</div>' :
    '<div class="heronum" style="font-size:16px;">생산 종료 후 자동 계산됩니다</div><div class="heromuted">생산 종료 체크포인트를 기록하면 소비기한이 계산돼요</div>';
  var html =
    '<div class="hero"><div class="eyebrow">품목별 자동계산 · 소비기한</div>'+heroBody+
      '<div class="herorow">'+
        '<div class="herostat"><div class="k">생산 시작</div><div class="v">'+(job.startAt?fmtDateTime(job.startAt):'미기록')+'</div></div>'+
        '<div class="herostat"><div class="k">생산 종료</div><div class="v">'+(job.endAt?fmtDateTime(job.endAt):'미기록')+'</div></div>'+
      '</div>'+
      '<div class="herofoot">* 소비기한 산정 기준(일수)은 예시 값이며 실제 사내 품질기준으로 교체가 필요합니다.</div>'+
    '</div>'+
    '<div class="eyebrow">골든타임 체크포인트</div>'+
    '<div class="cpgrid">'+CP_KEYS.map(function(k){ return cpTileHTML(lineId, slot, job, k); }).join('')+'</div>';
  document.getElementById('screen-root').innerHTML = html;

  var bar = document.getElementById('actionbar');
  if(bar) bar.remove();
  var actionHTML = '';
  if(job.status==='approved'){
    actionHTML = '<div class="banner banner-success">'+ICON.badge+'<span>결재 완료 · '+job.approvedBy+' · '+fmtDateTime(job.approvedAt)+'</span></div>'+
      '<button class="btn btn-outline" style="margin-top:10px;" onclick="openApproval('+lineId+','+slot+')">결재 내역 보기</button>';
  } else if(job.status==='pending_approval'){
    actionHTML = '<div class="banner banner-gold">'+ICON.badge+'<span>결재 대기 중 · '+fmtDateTime(job.requestedAt)+' 요청</span></div>'+
      '<button class="btn btn-outline" style="margin-top:10px;" onclick="openApproval('+lineId+','+slot+')">결재 화면 열기</button>';
  } else {
    var ready = approvalReady(job);
    actionHTML = '<button class="btn btn-primary" '+(ready?'':'disabled')+' onclick="requestApproval('+lineId+','+slot+')">결재 요청</button>'+
      (ready ? '' : '<div class="hint">촬영 '+filledCount(job)+'/6'+(job.endAt?'':' · 생산종료 미기록')+'</div>');
  }
  var actionbar = document.createElement('div');
  actionbar.className = 'actionbar';
  actionbar.id = 'actionbar';
  actionbar.innerHTML = actionHTML;
  document.querySelector('.phone').appendChild(actionbar);
}

function renderPhotoScreen(lineId, slot, key){
  var job = getJob(lineId, slot);
  var cp = job.checkpoints[key];
  renderAppBar(CP_LABELS[key]+' 사진', {showBack:true});
  var photo = pendingFileData || (cp.photo && cp.photo.indexOf('data:')===0 ? cp.photo : null);
  var isSeedOnly = cp.photo==='seed' && !pendingFileData;

  var frame = photo ?
    '<div class="photoframe"><img src="'+photo+'" alt=""></div>' :
    (isSeedOnly ?
      '<div class="photoframe" style="background:linear-gradient(135deg, color-mix(in srgb, var(--primary) 20%, var(--surface-2)), var(--surface-2));"><div class="photoempty">'+ICON.camera+'<span>예시 촬영 이미지</span></div></div>' :
      '<div class="photoframe"><div class="photoempty">'+ICON.camera+'<span>등록된 사진이 없습니다</span></div></div>');

  var locked = job.status==='approved';
  var timeRow = '';
  if(key==='start' || key==='end'){
    var t = cp.time ? new Date(cp.time) : new Date();
    timeRow = locked ?
      '<div class="timerow"><span class="k">시각</span><span class="v" style="font-family:var(--font-mono);font-weight:700;">'+(cp.time?fmtTime(t):'-')+'</span></div>' :
      '<div class="timerow"><span class="k">시각</span><input type="time" id="cp-time-input" value="'+pad(t.getHours())+':'+pad(t.getMinutes())+'"></div>';
  } else {
    var autoT = job.startAt ? addHours(job.startAt, CP_OFFSETS[key]) : null;
    timeRow = '<div class="timerow"><span class="k">예정 시각</span><span class="v" style="font-family:var(--font-mono);font-weight:700;">'+(autoT?fmtTime(autoT):'-')+'</span></div>';
  }

  var html =
    frame +
    (locked ? '<div class="hint" style="margin:0;">결재 완료된 배치예요 · 사진만 다시 등록할 수 있어요</div>' : '') +
    '<input type="file" id="cp-file-input" accept="image/*" capture="environment" style="display:none" onchange="handleFile(this)">'+
    '<button class="btn btn-outline" onclick="triggerFilePick()">'+(photo||isSeedOnly?'다시 촬영/선택':'사진 선택')+'</button>'+
    timeRow +
    '<div class="errtext" id="photo-err"></div>'+
    '<div class="btnrow">'+
      '<button class="btn btn-outline" onclick="deletePhoto()">삭제</button>'+
      '<button class="btn btn-primary" onclick="savePhoto()">저장</button>'+
    '</div>';
  document.getElementById('screen-root').innerHTML = html;
}

function renderApproval(lineId, slot){
  var job = getJob(lineId, slot);
  renderAppBar(lineId+'호기 · 결재', {showBack:true});
  var cb = consumeBy(job);
  var html =
    '<div class="hero"><div class="eyebrow">소비기한</div><div class="heronum">'+(cb?fmtDateTime(cb):'-')+'</div>'+
      '<div class="heromuted">기준 '+SHELF_LIFE_DAYS[job.weight]+'일 · 생산종료 기준 자동계산</div></div>'+
    '<div class="card"><div class="eyebrow" style="margin-bottom:6px;">생산 정보</div>'+
      '<div class="kv"><span class="k">호기</span><span class="v">'+lineId+'호기 · 품목선택 '+(slot+1)+'</span></div>'+
      '<div class="kv"><span class="k">품목</span><span class="v">'+job.product+' · '+job.weight+'</span></div>'+
      '<div class="kv"><span class="k">생산 시작</span><span class="v">'+fmtDateTime(job.startAt)+'</span></div>'+
      '<div class="kv"><span class="k">생산 종료</span><span class="v">'+fmtDateTime(job.endAt)+'</span></div>'+
    '</div>'+
    '<div class="eyebrow">체크포인트 사진</div>'+
    '<div class="minigrid">'+CP_KEYS.map(function(k){
      var cp = job.checkpoints[k];
      var inner = cp.photo && cp.photo.indexOf('data:')===0 ? '<img src="'+cp.photo+'" alt="">' : ICON.check;
      return '<div class="minithumb">'+inner+'</div>';
    }).join('')+'</div>';
  document.getElementById('screen-root').innerHTML = html;

  var old = document.getElementById('actionbar');
  if(old) old.remove();
  var actionHTML;
  if(job.status==='approved'){
    actionHTML = '<div class="banner banner-success">'+ICON.badge+'<span>결재 완료 · '+job.approvedBy+' · '+fmtDateTime(job.approvedAt)+'</span></div>';
  } else {
    actionHTML = '<button class="btn btn-primary" onclick="approveJob('+lineId+','+slot+')">결재 승인</button>'+
      '<div class="hint">요청 시각 '+fmtDateTime(job.requestedAt)+'</div>';
  }
  var actionbar = document.createElement('div');
  actionbar.className='actionbar'; actionbar.id='actionbar';
  actionbar.innerHTML = actionHTML;
  document.querySelector('.phone').appendChild(actionbar);
}

function render(){
  var top = nav[nav.length-1];
  var old = document.getElementById('actionbar');
  if(old) old.remove();
  document.getElementById('screen-root').classList.toggle('tight', top.screen==='home');
  if(top.screen==='home') renderHome();
  else if(top.screen==='weight') renderWeight(top.lineId, top.slot);
  else if(top.screen==='product') renderProduct(top.lineId, top.slot);
  else if(top.screen==='tracking') renderTracking(top.lineId, top.slot);
  else if(top.screen==='photo') renderPhotoScreen(top.lineId, top.slot, top.key);
  else if(top.screen==='approval') renderApproval(top.lineId, top.slot);
  document.getElementById('screen-root').scrollTop = 0;
}

state = loadState();
render();
</script>

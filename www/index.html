<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>골든타임 생산일지</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#EFF5F3; --surface:#FFFFFF; --surface-2:#E4EEEB;
  --border:#D4E0DC; --border-strong:#B9CAC4;
  --text-primary:#15211D; --text-secondary:#55685F; --text-muted:#8A9C93;
  --primary:#0E5A52; --primary-hover:#0A4740; --on-primary:#F4FBF9;
  --gold:#B67A0C; --gold-bg:#FBF0D9; --gold-text:#7A520A;
  --danger:#B5402B; --danger-bg:#FAEAE6;
  --success:#276B45; --success-bg:#E6F2EA;
  --shadow:0 20px 45px -25px rgba(15,40,35,0.35);
  --font-sans:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1614; --surface:#14201D; --surface-2:#1A2924;
    --border:#2A3A34; --border-strong:#3C4F47;
    --text-primary:#E9F3EF; --text-secondary:#9FB6AC; --text-muted:#6E8B7F;
    --primary:#4FC2AE; --primary-hover:#6BD4C0; --on-primary:#05231E;
    --gold:#E3A83B; --gold-bg:#2E2410; --gold-text:#F2C878;
    --danger:#E2695A; --danger-bg:#35201A;
    --success:#6FCB98; --success-bg:#163224;
    --shadow:0 20px 45px -25px rgba(0,0,0,0.6);
  }
}
:root[data-theme="dark"]{
  --bg:#0C1614; --surface:#14201D; --surface-2:#1A2924;
  --border:#2A3A34; --border-strong:#3C4F47;
  --text-primary:#E9F3EF; --text-secondary:#9FB6AC; --text-muted:#6E8B7F;
  --primary:#4FC2AE; --primary-hover:#6BD4C0; --on-primary:#05231E;
  --gold:#E3A83B; --gold-bg:#2E2410; --gold-text:#F2C878;
  --danger:#E2695A; --danger-bg:#35201A;
  --success:#6FCB98; --success-bg:#163224;
  --shadow:0 20px 45px -25px rgba(0,0,0,0.6);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
body{background:var(--bg);font-family:var(--font-sans);color:var(--text-primary);}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent;}
button:focus-visible, input:focus-visible{outline:2px solid var(--primary);outline-offset:2px;}
input{font:inherit;color:inherit;}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important;}}

.page{padding:2rem 1rem;display:flex;justify-content:center;}
.phone{
  width:100%;max-width:408px;background:var(--surface);
  border:0.5px solid var(--border);border-radius:28px;box-shadow:var(--shadow);
  overflow:hidden;display:flex;flex-direction:column;min-height:812px;position:relative;
}

/* modal sheets */
.modal-overlay{position:absolute;inset:0;background:rgba(10,16,14,0.55);display:flex;align-items:flex-end;z-index:20;}
.modal-overlay[hidden]{display:none;}
.sheet{width:100%;background:var(--surface);border-radius:20px 20px 0 0;padding:18px 16px;display:flex;flex-direction:column;gap:14px;}
.sheet h3{margin:0;font-size:15px;font-weight:500;}

/* crop */
.cropstage{position:relative;width:100%;overflow:hidden;border-radius:14px;background:#0b0f0e;}
.cropstage img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none;}
.cropbox{position:absolute;border:2px solid #fff;box-shadow:0 0 0 9999px rgba(0,0,0,0.55);cursor:move;touch-action:none;}
.crophandle{position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid var(--primary);touch-action:none;}
.crophandle[data-h="tl"]{left:-9px;top:-9px;cursor:nwse-resize;}
.crophandle[data-h="t"]{left:50%;top:-9px;transform:translateX(-50%);cursor:ns-resize;}
.crophandle[data-h="tr"]{right:-9px;top:-9px;cursor:nesw-resize;}
.crophandle[data-h="l"]{left:-9px;top:50%;transform:translateY(-50%);cursor:ew-resize;}
.crophandle[data-h="r"]{right:-9px;top:50%;transform:translateY(-50%);cursor:ew-resize;}
.crophandle[data-h="bl"]{left:-9px;bottom:-9px;cursor:nesw-resize;}
.crophandle[data-h="b"]{left:50%;bottom:-9px;transform:translateX(-50%);cursor:ns-resize;}
.crophandle[data-h="br"]{right:-9px;bottom:-9px;cursor:nwse-resize;}

/* time wheel picker */
.wheelrow{display:flex;gap:8px;position:relative;height:180px;}
.wheelrow::before{content:'';position:absolute;left:0;right:0;top:72px;height:36px;background:var(--surface-2);border-radius:8px;pointer-events:none;z-index:0;}
.wheelcol{flex:1;overflow-y:auto;scroll-snap-type:y mandatory;position:relative;z-index:1;scrollbar-width:none;}
.wheelcol::-webkit-scrollbar{display:none;}
.wheelpad{height:72px;flex:0 0 auto;}
.wheelitem{height:36px;display:flex;align-items:center;justify-content:center;scroll-snap-align:center;font-family:var(--font-mono);font-size:16px;color:var(--text-muted);}
.wheelitem.sel{color:var(--text-primary);font-weight:700;}
.timepick{display:flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:13px;font-weight:700;color:var(--text-primary);background:var(--surface);border:0.5px solid var(--border-strong);padding:7px 11px;border-radius:999px;}
.timepick:hover{border-color:var(--primary);color:var(--primary);}

/* signature pad */
.signpad-wrap{width:100%;aspect-ratio:16/9;background:var(--surface-2);border:1.5px dashed var(--border-strong);border-radius:14px;overflow:hidden;touch-action:none;}
.signpad-wrap canvas{width:100%;height:100%;display:block;}

/* role gate */
.rolescreen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:32px;padding:8px;text-align:center;}
.rolebrand{display:flex;flex-direction:column;align-items:center;gap:8px;}
.rolebrand .ciword{font-size:20px;}
.roletitle{font-size:16px;font-weight:500;color:var(--text-primary);}
.rolebtns{width:100%;display:flex;flex-direction:column;gap:12px;}
.rolebtn{width:100%;padding:20px;border-radius:16px;border:0.5px solid var(--border);background:var(--surface-2);text-align:center;font-size:16px;font-weight:700;color:var(--text-primary);}
.rolebtn:hover{border-color:var(--primary);}
.rolebtn .sub{display:block;font-size:12px;font-weight:400;color:var(--text-muted);margin-top:4px;}
.textinput{width:100%;height:44px;padding:0 12px;border-radius:10px;border:0.5px solid var(--border);background:var(--surface);font-size:15px;color:var(--text-primary);}
.textinput:focus-visible{border-color:var(--primary);}

/* admin calendar */
.calhead{display:flex;align-items:center;justify-content:space-between;}
.calhead button{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text-secondary);}
.calhead button:hover{background:var(--surface-2);}
.caltitle{font-size:15px;font-weight:500;font-family:var(--font-mono);}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.calwd{font-size:11px;color:var(--text-muted);text-align:center;padding:4px 0;}
.calday{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;border-radius:10px;font-size:13px;color:var(--text-muted);position:relative;background:transparent;}
.calday.empty{visibility:hidden;}
.calday.has-data{background:var(--surface-2);color:var(--text-primary);font-weight:700;}
.calday.has-data:hover{border:1px solid var(--primary);}
.calday.has-data::after{content:'';position:absolute;bottom:5px;width:4px;height:4px;border-radius:50%;background:var(--primary);}

/* view-only photo lightbox */
.viewsheet{width:100%;background:transparent;padding:0 16px 24px;display:flex;flex-direction:column;gap:12px;align-items:center;}
.viewsheet img{width:100%;border-radius:14px;background:var(--surface);}
.viewsheet .btn{max-width:200px;}
.appbar{
  display:flex;align-items:center;gap:10px;padding:16px;
  border-bottom:0.5px solid var(--border);background:var(--surface);flex:0 0 auto;
}
.appbar .backbtn{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:50%;flex:0 0 auto;color:var(--text-secondary);}
.appbar .backbtn:hover{background:var(--surface-2);}
.appbar .backbtn.hidden{visibility:hidden;}
.appbar h1{font-size:16px;font-weight:500;margin:0;flex:1;letter-spacing:-0.01em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.appbar .rightaction{font-size:13px;font-weight:500;color:var(--primary);padding:6px 10px;border-radius:999px;flex:0 0 auto;}
.appbar .rightaction:hover{background:var(--surface-2);}
.ciword{font-weight:700;letter-spacing:0.02em;color:var(--text-secondary);}
.appbar .ciword{flex:0 0 auto;font-size:12px;}
.appbar .datepick{flex:0 0 auto;max-width:120px;font-family:var(--font-mono);font-size:12px;background:var(--surface-2);border:0.5px solid var(--border);border-radius:8px;padding:5px 6px;color:var(--text-primary);}

.content{flex:1;overflow-y:auto;padding:18px 16px 28px;display:flex;flex-direction:column;gap:16px;}
.content.tight{padding:10px;gap:0;}
.eyebrow{font-size:11px;font-weight:500;letter-spacing:0.06em;text-transform:uppercase;color:var(--text-muted);}

.card{background:var(--surface-2);border:0.5px solid var(--border);border-radius:14px;padding:16px;}

/* home */
.homegrid{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:8px;}
.linetile{width:100%;height:100%;min-height:0;background:var(--surface-2);border:0.5px solid var(--border);border-radius:20px;padding:12px;display:flex;flex-direction:column;gap:8px;}
.tilehead{display:flex;align-items:baseline;gap:4px;flex:0 0 auto;padding:0 2px;}
.tilenum{font-family:var(--font-mono);font-size:22px;font-weight:700;line-height:1;color:var(--text-primary);}
.tilelabel{font-size:11px;color:var(--text-muted);}
.slotlist{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px;}
.slotrow{flex:1;min-height:0;width:100%;background:var(--surface);border:0.5px solid var(--border);border-radius:10px;padding:0 10px;display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:12.5px;font-weight:500;color:var(--text-primary);}
.slotrow:hover{border-color:var(--primary);}
.slotrow.empty{color:var(--text-muted);border-style:dashed;font-weight:400;}
.slotname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.slotdot{width:16px;height:16px;border-radius:50%;flex:0 0 auto;}
.chev{flex:0 0 auto;color:var(--text-muted);}

/* weight grid */
.gridpick{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.weighttile{background:var(--surface-2);border:0.5px solid var(--border);border-radius:14px;padding:22px 8px;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:19px;font-weight:700;}
.weighttile:hover{border-color:var(--primary);color:var(--primary);}

/* product list */
.productrow{display:flex;align-items:center;justify-content:space-between;width:100%;background:var(--surface-2);border:0.5px solid var(--border);border-radius:14px;padding:15px 16px;font-size:14px;font-weight:500;}
.productrow:hover{border-color:var(--primary);}

/* hero */
.hero{background:var(--gold-bg);border-radius:16px;padding:18px 18px 16px;}
.hero .eyebrow{color:var(--gold-text);}
.heronum{font-family:var(--font-mono);font-size:26px;font-weight:700;color:var(--gold-text);margin:4px 0 10px;letter-spacing:-0.01em;}
.heromuted{font-size:13px;color:var(--gold-text);opacity:0.85;}
.herolegend{margin-top:12px;padding-top:12px;border-top:0.5px solid color-mix(in srgb, var(--gold-text) 25%, transparent);font-size:12px;color:var(--gold-text);opacity:0.85;display:flex;flex-direction:column;gap:4px;}

/* checkpoint grid */
.cpgrid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;}
.cpwrap{display:flex;flex-direction:column;gap:4px;}
.cpmatch{font-size:10px;font-weight:700;text-align:center;padding:3px 4px;border-radius:6px;}
.cpmatch.match{background:var(--success-bg);color:var(--success);}
.cpmatch.mismatch{background:var(--danger-bg);color:var(--danger);}
.cptile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;aspect-ratio:1/1;border-radius:14px;padding:8px;text-align:center;}
.cptile.filled{background:var(--surface-2);border:0.5px solid var(--border);position:relative;}
.cptile.filled img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:14px;}
.cptile.filled .cpoverlay{position:absolute;inset:0;background:linear-gradient(to top, rgba(0,0,0,0.55), transparent 55%);border-radius:14px;}
.cptile.filled .cplabel, .cptile.filled .cptime{position:relative;color:#fff;z-index:1;}
.cptile.filled .checkbadge{position:absolute;top:6px;right:6px;width:18px;height:18px;border-radius:50%;background:var(--success);color:#fff;display:flex;align-items:center;justify-content:center;z-index:1;}
.cptile.active{background:var(--surface);border:1.5px dashed var(--border-strong);color:var(--primary);}
.cptile.active:hover{border-color:var(--primary);}
.cptile.locked{background:var(--surface-2);border:0.5px solid var(--border);color:var(--text-muted);cursor:default;}
.cplabel{font-size:11px;font-weight:500;line-height:1.25;}
.cptime{font-family:var(--font-mono);font-size:10px;color:var(--text-secondary);}
.cptile.active .cptime, .cptile.locked .cptime{color:inherit;opacity:0.75;}

/* bottom action */
.actionbar{border-top:0.5px solid var(--border);padding:14px 16px;background:var(--surface);flex:0 0 auto;}
.btn{width:100%;padding:13px;border-radius:12px;font-size:14px;font-weight:500;text-align:center;display:block;}
.btn-primary{background:var(--primary);color:var(--on-primary);}
.btn-primary:hover{background:var(--primary-hover);}
.btn-primary:disabled{background:var(--surface-2);color:var(--text-muted);cursor:not-allowed;}
.btn-outline{background:transparent;border:1px solid var(--border-strong);color:var(--text-primary);text-align:center;}
.btn-outline:hover{border-color:var(--danger);color:var(--danger);}
.hint{font-size:12px;color:var(--text-muted);text-align:center;margin-top:8px;}
.banner{border-radius:12px;padding:12px 14px;font-size:13px;display:flex;align-items:center;gap:10px;}
.banner-gold{background:var(--gold-bg);color:var(--gold-text);}
.banner-success{background:var(--success-bg);color:var(--success);}

/* photo detail */
.photoframe{width:100%;aspect-ratio:4/3;border-radius:16px;background:var(--surface-2);border:0.5px solid var(--border);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;}
.photoframe img{width:100%;height:100%;object-fit:cover;}
.photoempty{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--text-muted);}
.timerow{display:flex;align-items:center;justify-content:space-between;background:var(--surface-2);border:0.5px solid var(--border);border-radius:12px;padding:12px 14px;}
.timerow .k{font-size:13px;color:var(--text-secondary);}
.errtext{font-size:12px;color:var(--danger);}
.btnrow{display:flex;gap:10px;}
.btnrow .btn{flex:1;}

/* approval */
.kv{display:flex;justify-content:space-between;padding:8px 0;font-size:13px;border-bottom:0.5px solid var(--border);}
.kv:last-child{border-bottom:none;}
.kv .k{color:var(--text-secondary);}
.kv .v{font-weight:500;font-family:var(--font-mono);}
.minigrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
.minithumb{aspect-ratio:1/1;border-radius:8px;background:var(--surface);border:0.5px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--success);position:relative;overflow:hidden;}
.minithumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
</style>
</head>

/* Firebase Realtime Database backing. state.byDate is a local mirror kept
   in sync by live listeners; writes go straight to Firebase and the
   listener echoes them back (and pushes remote changes from other devices). */

function ensureDay(dateStr){
  if(!state.byDate[dateStr]) state.byDate[dateStr] = emptyDay();
  attachDayListener(dateStr);
  return state.byDate[dateStr];
}
/* Firebase RTDB drops any key whose value is null (and collapses arrays/
   objects made entirely of nulls), so a freshly round-tripped day is
   missing most of the all-null fields our empty templates start with.
   Rebuild the expected shape on read instead of trusting val() as-is. */
function normalizeJob(raw){
  if(!raw) return null;
  var job = emptyJob(raw.weight, raw.product);
  job.startAt = raw.startAt || null;
  job.endAt = raw.endAt || null;
  job.status = raw.status || 'in_progress';
  job.requestedAt = raw.requestedAt || null;
  job.requesterSignature = raw.requesterSignature || null;
  job.approvedBy = raw.approvedBy || null;
  job.approvedAt = raw.approvedAt || null;
  job.approverSignature = raw.approverSignature || null;
  var rawCps = raw.checkpoints || {};
  CP_KEYS.forEach(function(k){
    var rc = rawCps[k];
    job.checkpoints[k] = { photo:(rc && rc.photo) || null, time:(rc && rc.time) || null, ocrText:(rc && rc.ocrText) || null, ocrMatch:(rc && rc.ocrMatch) || null };
  });
  return job;
}
function normalizeDay(raw){
  var day = emptyDay();
  if(raw && raw.lines){
    [1,2,3,4].forEach(function(id){
      var rawLine = raw.lines[id];
      if(!rawLine || !rawLine.slots) return;
      for(var i=0;i<4;i++){
        day.lines[id].slots[i] = normalizeJob(rawLine.slots[i]);
      }
    });
  }
  return day;
}
function attachDayListener(dateStr){

function setupSignatureCanvas(){
  var canvas = document.getElementById('sign-canvas');
  var rect = canvas.parentElement.getBoundingClientRect();
  var dpr = window.devicePixelRatio || 1;
  canvas.width = rect.width*dpr;
  canvas.height = rect.height*dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.lineWidth = 2.5;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = getComputedStyle(document.body).getPropertyValue('--text-primary').trim() || '#15211D';
  var drawing = false;
  function pos(e){ var r=canvas.getBoundingClientRect(); return { x:e.clientX-r.left, y:e.clientY-r.top }; }
  canvas.addEventListener('pointerdown', function(e){
    drawing = true;
    var p = pos(e);
    ctx.beginPath(); ctx.moveTo(p.x, p.y);
    canvas.setPointerCapture(e.pointerId);
    document.getElementById('sign-save-btn').disabled = false;
  });
  canvas.addEventListener('pointermove', function(e){
    if(!drawing) return;
    var p = pos(e);
    ctx.lineTo(p.x, p.y); ctx.stroke();
  });
  function stopDrawing(){ drawing = false; }
  canvas.addEventListener('pointerup', stopDrawing);
  canvas.addEventListener('pointercancel', stopDrawing);
}

function realDaysInMonth(month, year){ return new Date(year, month, 0).getDate(); }
function displayCap(month, year){ return month===2 ? 28 : realDaysInMonth(month, year); }
function letterFor(n){ return String.fromCharCode(64+n); }

function computeConsumeInfo(dateStr, category){
  var parts = dateStr.split('-');
  var y = parseInt(parts[0],10), m = parseInt(parts[1],10), d = parseInt(parts[2],10);
  var yt = y+2;
  if(category==='10'){
    var raw = d-10;
    var mt, dtRaw, fromBorrow;
    if(raw>=1){ mt=m; dtRaw=raw; fromBorrow=false; }
    else { mt=m-1; if(mt===0){ mt=12; yt-=1; } dtRaw=raw+30; fromBorrow=true; }
    var cap = displayCap(mt, yt);
    var dt, suffix='';
    if(dtRaw>cap){ dt=cap; suffix=letterFor(dtRaw-cap); }
    else { dt=dtRaw; if(fromBorrow && dtRaw===21 && cap===31) suffix='A'; }
    return { year:yt, month:mt, day:dt, suffix:suffix };
  }
  var n = category==='2' ? 2 : 1;
  var real = new Date(yt, m-1, d);
  real.setDate(real.getDate()-n);
  var mt2=real.getMonth()+1, dt2=real.getDate(), yt2=real.getFullYear(), suffix2='';
  if(mt2===2 && dt2===29){ dt2=28; suffix2='A'; }
  return { year:yt2, month:mt2, day:dt2, suffix:suffix2 };
}
function computeConsumeDisplay(dateStr, product){
  var info = computeConsumeInfo(dateStr, productCategory(product));
  return info.year+'.'+pad(info.month)+'.'+pad(info.day)+info.suffix;
}
function computeConsumeDateStr(dateStr, product){
  var info = computeConsumeInfo(dateStr, productCategory(product));
  return info.year+'-'+pad(info.month)+'-'+pad(info.day);
}

var CROP_MIN = 40;
var CROP_HANDLE_IDS = ['tl','t','tr','l','r','bl','b','br'];
var CROP_HANDLE_AXES = {
  tl:{ax:-1,ay:-1}, t:{ax:0,ay:-1}, tr:{ax:1,ay:-1},
  l:{ax:-1,ay:0}, r:{ax:1,ay:0},
  bl:{ax:-1,ay:1}, b:{ax:0,ay:1}, br:{ax:1,ay:1}
};
var cropImg = null;
var cropStageEl = null;
var cropBox = { x:0, y:0, w:0, h:0 };

function renderCropBox(){
  var box = document.getElementById('cropbox');
  box.style.left = cropBox.x+'px';
  box.style.top = cropBox.y+'px';
  box.style.width = cropBox.w+'px';
  box.style.height = cropBox.h+'px';
}
function initCropBox(){
  cropStageEl = document.getElementById('cropstage');
  var stageW = cropStageEl.clientWidth, stageH = cropStageEl.clientHeight;
  var w = stageW*0.86, h = stageH*0.86;
  cropBox = { x:(stageW-w)/2, y:(stageH-h)/2, w:w, h:h };
  renderCropBox();
}
function attachCropBoxDrag(){
  var box = document.getElementById('cropbox');
  var mode=null, startX=0, startY=0, start={}, stageW=0, stageH=0;

  box.addEventListener('pointerdown', function(e){
    stageW = cropStageEl.clientWidth; stageH = cropStageEl.clientHeight;
    var h = e.target.dataset ? e.target.dataset.h : null;
    mode = h || 'move';
    startX=e.clientX; startY=e.clientY;
    start = { x:cropBox.x, y:cropBox.y, w:cropBox.w, h:cropBox.h };
    box.setPointerCapture(e.pointerId);
    e.stopPropagation();
  });
  box.addEventListener('pointermove', function(e){
    if(!mode) return;
    if(mode==='move'){
      var nx = start.x+(e.clientX-startX), ny = start.y+(e.clientY-startY);
      cropBox.x = Math.max(0, Math.min(stageW-cropBox.w, nx));
      cropBox.y = Math.max(0, Math.min(stageH-cropBox.h, ny));
    } else {
      var axes = CROP_HANDLE_AXES[mode];
      var rect = cropStageEl.getBoundingClientRect();
      var px = Math.max(0, Math.min(stageW, e.clientX-rect.left));
      var py = Math.max(0, Math.min(stageH, e.clientY-rect.top));
      var x=start.x, y=start.y, w=start.w, h=start.h;
      if(axes.ax===-1){ var nx2=Math.min(px, start.x+start.w-CROP_MIN); x=nx2; w=(start.x+start.w)-nx2; }
      else if(axes.ax===1){ var nr=Math.max(px, start.x+CROP_MIN); w=nr-start.x; }
      if(axes.ay===-1){ var ny2=Math.min(py, start.y+start.h-CROP_MIN); y=ny2; h=(start.y+start.h)-ny2; }
      else if(axes.ay===1){ var nb=Math.max(py, start.y+CROP_MIN); h=nb-start.y; }
      cropBox = { x:x, y:y, w:w, h:h };
    }
    renderCropBox();
  });
  box.addEventListener('pointerup', function(){ mode=null; });
  box.addEventListener('pointercancel', function(){ mode=null; });
}
function openCropSheet(){

function confirmCrop(){
  var scale = cropImg.naturalWidth / cropStageEl.clientWidth;
  var sx = cropBox.x*scale, sy = cropBox.y*scale, sw = cropBox.w*scale, sh = cropBox.h*scale;
  var maxDim = 720;
  var outW = sw, outH = sh;
  if(sw>=sh){ outW = Math.min(maxDim, sw); outH = outW*(sh/sw); }
  else { outH = Math.min(maxDim, sh); outW = outH*(sw/sh); }
  var canvas = document.createElement('canvas');
  canvas.width = Math.round(outW); canvas.height = Math.round(outH);

    if(!val){ document.getElementById('photo-err').textContent = '시각을 입력해 주세요.'; return; }
    var base = cp.time ? new Date(cp.time) : new Date();
    var parts = val.split(':');

    var iso = base.toISOString();
    cp.time = iso;
    if(key==='start') job.startAt = iso;
    else if(key==='end') job.endAt = iso;
  }
  pendingFileData = null;
  saveState();
  runOcrCheck(lineId, slot, key);
  goBack();
}

/* On-device OCR (Google ML Kit via Capacitor). Only available inside the
   native app - silently skipped on web/Pages where the plugin isn't
   installed. Runs after a photo save, updates the checkpoint's OCR
   fields once done, and re-renders whatever screen is showing then. */
function ocrDigitsOnly(text){
  if(!text) return '';
  return text.replace(/[oO]/g,'0').replace(/[lI]/g,'1').replace(/\D/g,'');
}
async function runOcrCheck(lineId, slot, key){
  var plugins = window.Capacitor && window.Capacitor.Plugins;
  if(!plugins || !plugins.TextRecognition || !plugins.Filesystem) return;
  var job = getJob(lineId, slot);
  var cp = job.checkpoints[key];
  if(!cp.photo || cp.photo.indexOf('data:')!==0) return;
  var m = /^data:image\/(\w+);base64,(.+)$/.exec(cp.photo);
  if(!m) return;
  var ext = m[1]==='jpg' ? 'jpeg' : m[1];
  var fname = 'ocr_'+Date.now()+'.'+ext;
  try{
    var written = await plugins.Filesystem.writeFile({ path:fname, data:m[2], directory:'CACHE' });
    var result = await plugins.TextRecognition.processImage({ path:written.uri, script:'LATIN' });
    var rawText = (result && result.text) || '';
    var expectedDigits = computeConsumeDateStr(currentDateStr, job.product).replace(/-/g,'');
    var textDigits = ocrDigitsOnly(rawText);
    cp.ocrText = rawText || null;
    cp.ocrMatch = rawText ? (textDigits.indexOf(expectedDigits)>=0 ? 'match' : 'mismatch') : null;
    saveState();
    render();
    try{ await plugins.Filesystem.deleteFile({ path:fname, directory:'CACHE' }); }catch(e){}
  }catch(e){
    console.warn('OCR failed', e);
  }
}

function arrayBufferToBase64(buffer){
  var bytes = new Uint8Array(buffer);
  var binary = '';
  var chunk = 0x8000;
  for(var i=0;i<bytes.length;i+=chunk){
    binary += String.fromCharCode.apply(null, bytes.subarray(i, i+chunk));
  }
  return btoa(binary);
}

async function exportDayExcel(dateStr){
  if(typeof ExcelJS==='undefined'){ alert('엑셀 라이브러리를 불러오지 못했어요. 잠시 후 다시 시도해 주세요.'); return; }
  var wb = new ExcelJS.Workbook();
  var day = state.byDate[dateStr];
  [1,2,3,4].forEach(function(lineId){
    var ws = wb.addWorksheet(lineId+'호기');
    ws.getCell('B2').value = '작성일';
    ws.getCell('B2').font = {bold:true};
    ws.getCell('C2').value = dateStr.replace(/-/g,'.');
    var slots = day ? day.lines[lineId].slots : [null,null,null,null];
    slots.forEach(function(job, i){
      var base = 4 + i*4;
      var labelCell = ws.getCell('B'+base);
      labelCell.value = job ? (job.product+' '+job.weight) : ('품목'+(i+1));
      labelCell.font = {bold:true};
      var headerRow = base+1;
      CP_KEYS.forEach(function(key, ci){
        var col = String.fromCharCode(66+ci);
        var cell = ws.getCell(col+headerRow);
        cell.value = CP_LABELS[key];
        cell.font = {bold:true};
        cell.alignment = {horizontal:'center'};
        cell.border = {top:{style:'thin'},left:{style:'thin'},right:{style:'thin'},bottom:{style:'thin'}};
      });
      var photoRow = base+2;
      ws.getRow(photoRow).height = 110;
      if(job){
        CP_KEYS.forEach(function(key, ci){
          var cp = job.checkpoints[key];
          if(cp.photo && cp.photo.indexOf('data:')===0){
            var m = /^data:image\/(\w+);base64,(.+)$/.exec(cp.photo);
            if(m){
              var ext = m[1]==='jpg' ? 'jpeg' : m[1];
              var imgId = wb.addImage({ base64:m[2], extension:ext });
              ws.addImage(imgId, { tl:{col:1+ci, row:photoRow-1}, ext:{width:95, height:105} });
            }
          }
        });
      }
    });
    ws.getColumn(1).width = 3;
    for(var c=2;c<=9;c++) ws.getColumn(c).width = 14;
  });

  var buffer = await wb.xlsx.writeBuffer();
  var filename = dateStr+'_golden_time.xlsx';
  var mime = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';

  /* native app (Capacitor): save to device Documents + open native share sheet */
  if(window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Filesystem){
    try{
      var base64 = arrayBufferToBase64(buffer);
      var Filesystem = window.Capacitor.Plugins.Filesystem;
      var writeResult = await Filesystem.writeFile({ path:filename, data:base64, directory:'DOCUMENTS' });
      if(window.Capacitor.Plugins.Share){
        await window.Capacitor.Plugins.Share.share({ title:filename, url:writeResult.uri });
      } else {
        alert('저장 완료: '+writeResult.uri);
      }
    }catch(e){
      alert('엑셀 저장에 실패했어요: '+(e && e.message ? e.message : e));
    }
    return;
  }

  /* Claude Artifact preview */
  if(window.claude){
    var blob = new Blob([buffer], { type:mime });
    var downloads = await claude.use('downloads');
    if(!downloads){ alert('이 화면에서는 파일 저장 기능을 사용할 수 없어요.'); return; }
    try{
      await downloads.save({ filename:filename, data:blob });
    }catch(e){
      if(e && e.code==='declined') return;
      alert('엑셀 저장에 실패했어요: '+(e && e.message ? e.message : e));
    }
    return;
  }

  /* plain browser fallback */
  var blob2 = new Blob([buffer], { type:mime });
  var url = URL.createObjectURL(blob2);
  var a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 5000);
}

      '<div class="kv"><span class="k">호기</span><span class="v">'+lineId+'호기 · 품목선택 '+(slot+1)+'</span></div>'+
      '<div class="kv"><span class="k">품목</span><span class="v">'+job.product+' · '+job.weight+'</span></div>'+
      '<div class="kv"><span class="k">생산 시작</span><span class="v">'+fmtDateTime(job.startAt)+'</span></div>'+
      '<div class="kv"><span class="k">생산 종료</span><span class="v">'+fmtDateTime(job.endAt)+'</span></div>'+
    '</div>'+
    '<div class="eyebrow">체크포인트 사진</div>'+
    '<div class="minigrid">'+CP_KEYS.map(function(k){
      var cp = job.checkpoints[k];
      var inner = cp.photo && cp.photo.indexOf('data:')===0 ? '<img src="'+cp.photo+'" alt="">' : ICON.check;
      return '<div class="minithumb">'+inner+'</div>';
    }).join('')+'</div>'+
    (job.requesterSignature ?
      '<div class="eyebrow">요청자 서명</div><img src="'+job.requesterSignature+'" alt="요청자 서명" style="width:100%;max-width:220px;background:var(--surface);border:0.5px solid var(--border);border-radius:10px;padding:8px;">' :
      '')+
    (job.approverSignature ?
      '<div class="eyebrow">승인자 서명</div><img src="'+job.approverSignature+'" alt="승인자 서명" style="width:100%;max-width:220px;background:var(--surface);border:0.5px solid var(--border);border-radius:10px;padding:8px;">' :
      '');
  document.getElementById('screen-root').innerHTML = html;

  var old = document.getElementById('actionbar');
  if(old) old.remove();
  var actionHTML;
  if(job.status==='approved'){
    actionHTML = '<div class="banner banner-success">'+ICON.badge+'<span>결재 완료 · '+job.approvedBy+' · '+fmtDateTime(job.approvedAt)+'</span></div>';
  } else if(adminMode){
    actionHTML = '<button class="btn btn-primary" onclick="openSignaturePad('+lineId+','+slot+',\'approve\')">결재 승인</button>'+
      '<div class="hint">요청 시각 '+fmtDateTime(job.requestedAt)+'</div>';
  } else {
    actionHTML = '<div class="hint" style="margin:0;">관리자 승인을 기다리고 있어요 · 요청 시각 '+fmtDateTime(job.requestedAt)+'</div>';
  }
  var actionbar = document.createElement('div');
  actionbar.className='actionbar'; actionbar.id='actionbar';
  actionbar.innerHTML = actionHTML;
  document.querySelector('.phone').appendChild(actionbar);
}

function render(){
  var top = nav[nav.length-1];
  var old = document.getElementById('actionbar');
  if(old) old.remove();
  document.getElementById('screen-root').classList.toggle('tight', top.screen==='home');
  if(top.screen==='role') renderRole();
  else if(top.screen==='adminLogin') renderAdminLogin();
  else if(top.screen==='adminCalendar') renderAdminCalendar();
  else if(top.screen==='home') renderHome();
  else if(top.screen==='weight') renderWeight(top.lineId, top.slot);
  else if(top.screen==='product') renderProduct(top.lineId, top.slot);
  else if(top.screen==='tracking') renderTracking(top.lineId, top.slot);
  else if(top.screen==='photo') renderPhotoScreen(top.lineId, top.slot, top.key);
  else if(top.screen==='approval') renderApproval(top.lineId, top.slot);
  document.getElementById('screen-root').scrollTop = 0;
}

var LATEST_URL = 'https://wndud0808.github.io/TEST3/';
function checkForUpdate(){
  fetch('./version.json', { cache:'no-store' })
    .then(function(r){ return r.json(); })
    .then(function(local){
      return fetch(LATEST_URL+'version.json?t='+Date.now(), { cache:'no-store' })
        .then(function(r){ return r.json(); })
        .then(function(remote){
          if(remote && local && remote.version && local.version && remote.version!==local.version){
            showUpdatePopup();
          }
        });
    })
    .catch(function(){ /* offline, blocked, or no version.json (e.g. local dev) - ignore silently */ });
}
function showUpdatePopup(){
  document.getElementById('update-overlay').innerHTML =
    '<div class="sheet">'+
      '<h3>새 버전이 있어요</h3>'+
      '<div class="hint" style="margin:0;">최신 버전으로 업데이트할까요?</div>'+
      '<div class="btnrow">'+
        '<button class="btn btn-outline" onclick="document.getElementById(\'update-overlay\').hidden=true">나중에</button>'+
        '<button class="btn btn-primary" onclick="applyUpdate()">업데이트</button>'+
      '</div>'+
    '</div>';
  document.getElementById('update-overlay').hidden = false;
}
function applyUpdate(){
  window.location.href = LATEST_URL+'?t='+Date.now();
}

var RELEASE_API_URL = 'https://api.github.com/repos/wndud0808/TEST3/releases/tags/debug-build';
var RELEASE_APK_URL = 'https://github.com/wndud0808/TEST3/releases/download/debug-build/golden-time-log-debug.apk';
function nativeCheckForUpdate(){
  if(!window.Capacitor || !window.Capacitor.isNativePlatform || !window.Capacitor.isNativePlatform()) return;
  fetch('./native_version.json', { cache:'no-store' })
    .then(function(r){ return r.json(); })
    .then(function(local){
      return fetch(RELEASE_API_URL+'?t='+Date.now(), { cache:'no-store', headers:{ 'Accept':'application/vnd.github+json' } })
        .then(function(r){ return r.json(); })
        .then(function(release){
          var m = /build-sha:([0-9a-f]{40})/.exec((release && release.body) || '');
          var remoteSha = m && m[1];
          if(remoteSha && local && local.sha && remoteSha!==local.sha){
            showNativeUpdatePopup();
          }
        });
    })
    .catch(function(){ /* offline, blocked, or no native_version.json (e.g. old APK before this feature) - ignore silently */ });
}
function showNativeUpdatePopup(){
  document.getElementById('update-overlay').innerHTML =
    '<div class="sheet">'+
      '<h3>새 앱 버전이 있어요</h3>'+
      '<div class="hint" style="margin:0;">기능이 추가된 새 APK가 나왔어요. 다운로드 후 설치해주세요.</div>'+
      '<div class="btnrow">'+
        '<button class="btn btn-outline" onclick="document.getElementById(\'update-overlay\').hidden=true">나중에</button>'+
        '<button class="btn btn-primary" onclick="downloadNativeUpdate()">다운로드</button>'+
      '</div>'+
    '</div>';
  document.getElementById('update-overlay').hidden = false;
}
function downloadNativeUpdate(){
  var plugins = window.Capacitor && window.Capacitor.Plugins;
  if(plugins && plugins.Browser){
    plugins.Browser.open({ url: RELEASE_APK_URL });
  } else {
    window.open(RELEASE_APK_URL, '_blank');
  }
  document.getElementById('update-overlay').hidden = true;
}

render();
checkForUpdate();
nativeCheckForUpdate();
</script>
</body>

name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'www/**'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Ensure a stable debug signing keystore
        run: |
          mkdir -p ~/.android
          if [ -f ci/debug.keystore ]; then
            echo "Using existing committed debug keystore"
            cp ci/debug.keystore ~/.android/debug.keystore
          else
            echo "No committed debug keystore yet - generating and committing one"
            mkdir -p ci
            keytool -genkeypair -v \
              -keystore ci/debug.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10950 \
              -dname "CN=Android Debug,O=Android,C=US"
            cp ci/debug.keystore ~/.android/debug.keystore
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add ci/debug.keystore
            git commit -m "ci: add stable debug signing keystore [skip ci]"
            git push
          fi

      - name: Install dependencies
        run: npm install

      - name: Add Android platform (generated fresh each build)
        run: npx cap add android

      - name: Sync web assets into the native project
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: golden-time-log-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Rename APK for the release asset
        run: cp android/app/build/outputs/apk/debug/app-debug.apk golden-time-log-debug.apk

      - name: Publish/update GitHub Release with the APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-build
          name: 골든타임 생산일지 (debug build)
          body: 자동 빌드된 최신 디버그 APK입니다. 폰에서 이 파일을 눌러 설치하세요 (출처를 알 수 없는 앱 설치 허용 필요).
          prerelease: true
          files: golden-time-log-debug.apk

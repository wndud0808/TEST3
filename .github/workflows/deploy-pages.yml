# Web preview of the app at https://wndud0808.github.io/TEST3/
# Requires Settings > Pages > Source = "GitHub Actions" (enabled).
#
# Build and deploy are separate jobs (GitHub's recommended layout): when the artifact
# was uploaded and deployed inside one job, the deploy step sometimes failed with
# "No artifacts named github-pages" right after the upload. If a deploy still fails
# that way, re-run it from the Actions tab ("Re-run failed jobs").
name: Deploy web preview to GitHub Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'www/**'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/deploy-pages.yml'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Stamp app version (hash of the served content)
        run: |
          HASH=$(sha256sum www/index.html | cut -d' ' -f1)
          echo "{\"version\":\"$HASH\"}" > www/version.json

      - name: Upload www/ as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: www

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
